apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: psql-exec, namespace: omni}
rules:
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: omni-agent-psql-exec, namespace: omni}
subjects:
  - {kind: Group, name: omni-agent, apiGroup: rbac.authorization.k8s.io}
roleRef: {kind: Role, name: psql-exec, apiGroup: rbac.authorization.k8s.io}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: psql, namespace: omni, labels: {app: omni-psql}}
spec:
  replicas: 1
  selector: {matchLabels: {app: omni-psql}}
  template:
    metadata: {labels: {app: omni-psql}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 999, runAsGroup: 999}
      containers:
        - name: psql
          image: postgres:17-alpine
          command: ["sleep", "infinity"]
          envFrom: [{secretRef: {name: omni-psql}}]
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 128Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: false, capabilities: {drop: ["ALL"]}}
---
apiVersion: batch/v1
kind: Job
metadata: {name: omni-readonly-bootstrap, namespace: btdash-backend}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: psql
          image: postgres:17-alpine
          envFrom:
            - {secretRef: {name: btdash-backend-env}}
            - {secretRef: {name: omni-bootstrap}}
          command: ["sh", "-ec"]
          args:
            - |
              url=$(printf '%s' "$DATABASE_URL" | sed -E 's#^postgres(ql)?\+[a-z0-9]+://#postgresql://#')
              psql "$url" -v ON_ERROR_STOP=1 -v pw="$OMNI_PASSWORD" <<'SQL'
              DO $$ BEGIN
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'omni_readonly') THEN
                  CREATE ROLE omni_readonly LOGIN;
                END IF;
              END $$;
              ALTER ROLE omni_readonly PASSWORD :'pw';
              ALTER ROLE omni_readonly CONNECTION LIMIT 5;
              ALTER ROLE omni_readonly NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;
              GRANT pg_read_all_data TO omni_readonly;
              ALTER ROLE omni_readonly INHERIT;
              ALTER ROLE omni_readonly SET default_transaction_read_only = on;
              ALTER ROLE omni_readonly SET statement_timeout = '60s';
              ALTER ROLE omni_readonly SET idle_in_transaction_session_timeout = '60s';
              SELECT rolname, rolconnlimit, rolconfig FROM pg_roles WHERE rolname = 'omni_readonly';
              SQL
