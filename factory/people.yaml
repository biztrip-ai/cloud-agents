# Jira account id → the git identity their tickets are authored as.
#
# Keyed by accountId, not display name: names are neither stable nor unique,
# and Jira's API does not return email addresses at all.
#
# The addresses are GitHub's own `<id>+<login>@users.noreply.github.com` form.
# It links the commit to that account without anyone publishing a real mailbox,
# and it needs no verification step. Never construct one by hand: read the id
# and login from the GitHub API, because a wrong address credits whoever owns it.
#
# Someone missing here is not an error. Their tickets are authored by the
# factory, which is the right answer for tickets no person asked for.
#
# Do NOT add the account the agents themselves write Jira with. Every ticket
# BzPM creates carries that account as its reporter, so mapping it would credit
# one person for the factory's own output.

