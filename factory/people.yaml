# Jira account id → the git identity their tickets are authored as.
#
# Keyed by accountId, not display name: names are neither stable nor unique,
# and Jira's API does not return email addresses at all. One person can hold
# more than one account id, so give each its own entry.
#
# The addresses are GitHub's own `<id>+<login>@users.noreply.github.com` form.
# It links the commit to that account without anyone publishing a mailbox, and
# needs no verification step. Never construct one by hand: read the id and
# login from the GitHub API, because a wrong address credits whoever owns it.
#
# Someone missing here is not an error. Their tickets are authored by the
# factory, which is the right answer for tickets no person asked for.

